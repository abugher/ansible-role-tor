---
install_packages:
  - 'tor'
install_files:
  - owner:                              'root'
    group:                              'root'
    mode:                               '0644'
    src:                                'files/conf/cron.d/kick_tor'
    dest:                               '/etc/cron.d/kick_tor'
  - owner:                              'root'
    group:                              'root'
    mode:                               '0755'
    src:                                'files/bin/kick_tor'
    dest:                               '/usr/local/bin/kick_tor'
install_packages_from_release:          'bookworm-backports'
template_files:
  - owner:                              'root'
    group:                              'root'
    mode:                               '0644'
    src:                                'templates/conf/torrc.j2'
    dest:                               '/etc/tor/torrc'
  - owner:                              'root'
    group:                              'root'
    mode:                               '0644'
    src:                                "templates/conf/front_page.html.j2"
    dest:                               '/etc/tor/front_page.html'
restart_services:
  - 'tor'
enable_services:
  - 'tor'
start_services:
  - 'tor'
